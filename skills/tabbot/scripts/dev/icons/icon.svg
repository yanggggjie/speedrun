<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D9C3"/><stop offset="1" stop-color="#0E9488"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20426B"/><stop offset="1" stop-color="#10253B"/></linearGradient>
  </defs>
  <!-- 天线 -->
  <line x1="92" y1="36" x2="92" y2="17" stroke="#0B6F66" stroke-width="5" stroke-linecap="round"/>
  <circle cx="92" cy="13" r="8" fill="#FBBF24"/><circle cx="89.5" cy="10.5" r="2.4" fill="#FFF3C4"/>
  <!-- 耳朵 -->
  <rect x="3" y="62" width="15" height="32" rx="7.5" fill="#0B6F66"/>
  <rect x="110" y="62" width="15" height="32" rx="7.5" fill="#0B6F66"/>
  <!-- 头：浏览器标签页（左上角凸起的标签）+ 窗口 -->
  <rect x="14" y="22" width="58" height="42" rx="13" fill="url(#body)"/>
  <rect x="14" y="36" width="100" height="80" rx="22" fill="url(#body)"/>
  <!-- 标签上的小图标和标题条 -->
  <circle cx="30" cy="42" r="4.6" fill="#FBBF24"/>
  <rect x="40" y="39.5" width="22" height="5.5" rx="2.75" fill="#FFFFFF" opacity=".6"/>
  <!-- 屏幕脸 -->
  <rect x="26" y="54" width="76" height="54" rx="17" fill="url(#screen)"/>
  <!-- 眼睛 -->
  <circle cx="49" cy="78" r="10" fill="#B6F24A"/><circle cx="79" cy="78" r="10" fill="#B6F24A"/>
  <circle cx="52.5" cy="74" r="3.4" fill="#FFFFFF"/><circle cx="82.5" cy="74" r="3.4" fill="#FFFFFF"/>
  <!-- 嘴 -->
  <path d="M56 95 Q64 102 72 95" stroke="#B6F24A" stroke-width="4.2" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="36.5" cy="93" rx="5.2" ry="3.3" fill="#FB7185" opacity=".75"/><ellipse cx="91.5" cy="93" rx="5.2" ry="3.3" fill="#FB7185" opacity=".75"/>
</svg>
