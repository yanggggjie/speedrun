<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs><clipPath id="mouth"><path d="M34 54H94A30 30 0 0 1 34 54Z"/></clipPath></defs>
  <!-- 标签栏：一条略深的粉色横栏 -->
  <rect x="2" y="84" width="124" height="34" rx="17" fill="#F2709A"/>
  <!-- 标签：立在栏上，两个下角向外翻，和栏平滑相连（浏览器标签的样子） -->
  <path d="M19 84A8 8 0 0 0 27 76V24A16 16 0 0 1 43 8H85A16 16 0 0 1 101 24V76A8 8 0 0 0 109 84Z" fill="#FF8FAE"/>
  <!-- 眼睛：两个小点 -->
  <circle cx="49" cy="34" r="7" fill="#5A1730"/>
  <circle cx="79" cy="34" r="7" fill="#5A1730"/>
  <!-- 大嘴：张开的半圆，里面是舌头 -->
  <path d="M34 54H94A30 30 0 0 1 34 54Z" fill="#7B1E3C"/>
  <ellipse cx="64" cy="82" rx="17" ry="11" fill="#FF6F91" clip-path="url(#mouth)"/>
</svg>
